name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked build toolchain
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv lock --check
      - run: python -m build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
