name: security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-code-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify dependency lock
        run: uv lock --check
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Python security scan
        run: bandit -r application core domain evaluation models observability persistence policy strategies utils main.py -ll
      - name: Build distributions
        run: python -m build
      - name: Generate CycloneDX SBOM
        run: pip-audit --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: security-artifacts
          path: |
            dist/
            sbom.cdx.json

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: jailbreak-framework:ci
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jailbreak-framework:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
