name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --locked --extra dev --extra reporting
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify dependency lock
        run: uv lock --check
      - name: Lint
        run: ruff check .
      - name: Static types
        run: mypy application core domain evaluation models observability persistence policy strategies utils main.py
      - name: Compile
        run: python -m compileall -q application core domain evaluation models observability persistence policy strategies utils main.py
      - name: Evaluation quality gates
        run: |
          python main.py benchmark-evaluator
          python main.py benchmark-scoring
          python main.py health --profile mock
      - name: Tests and coverage
        run: >-
          pytest tests -p no:warnings
          --cov=application --cov=core --cov=domain --cov=evaluation
          --cov=models --cov=observability --cov=persistence --cov=policy
          --cov=strategies --cov=utils
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
